# CI — build + lint on every push and PR.
#
# 28 releases shipped before this file existed; the checks here are the ones that would
# have caught real, shipped bugs (silent room-classification regressions, lint-visible
# permission gaps). Deliberately NO release/signing job: the release keystore stays on the
# owner's machine, never in GitHub secrets — release builds are local by policy
# (see apps/android/app/build.gradle.kts, the signing block).
#
# assembleDebug needs no secrets by design: without keystore.properties the release
# variant is simply unsigned and debug is unaffected — the build.gradle.kts was written
# for exactly this "fresh clone / CI" case.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build (debug)
        run: ./gradlew assembleDebug

      # lintDebug, not lint: the release variant needs nothing lint checks differently,
      # and one variant halves the time. Errors fail the build (0 as of the commit that
      # added this file); warnings don't — drive them down, don't let them rot into noise.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-report
          path: apps/android/app/build/reports/lint-results-debug.html

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-bolt-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: privacy-bolt-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            ANDROID_SERIAL=emulator-5554 python3 scripts/ci/android-ui.py
